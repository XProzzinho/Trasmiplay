name: Prints das telas

on:
  workflow_dispatch:

jobs:
  prints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Gerar prints
        run: gradle testReleaseUnitTest --no-daemon -Dshots=1 --tests '*ScreensTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints
          path: app/build/shots/
